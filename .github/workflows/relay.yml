name: Relay
on:
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:dry-run
